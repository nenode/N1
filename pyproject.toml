[project]
name = "n1"
version = "0.1.0"
description = "A small trainable autoregressive language model"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.18",
    "torch>=2.2",
]

[tool.setuptools]
packages = ["n1"]

[project.scripts]
n1-train = "n1.train:main"
n1-chat = "n1.chat:main"
n1-story = "n1.story:main"

[tool.pytest.ini_options]
pythonpath = ["."]
